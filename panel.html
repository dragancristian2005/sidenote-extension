<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gemini Sidekick</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <strong>Gemini Sidekick</strong>
    <span class="spacer"></span>
    <button id="historyBtn" title="Past chats">History</button>
    <button id="newChat" title="Start a new conversation">New chat</button>
    <button id="settingsBtn" title="Settings">⚙</button>
  </header>

  <section id="history" hidden>
    <ul id="chatList"></ul>
  </section>

  <section id="settings" hidden>
    <p class="hint" id="providerLinks"></p>
    <label><span id="keyLabel">API key</span>
      <input id="apiKey" type="password" autocomplete="off">
    </label>
    <label id="baseUrlLabel">API base URL
      <input id="baseUrl" type="text" autocomplete="off" spellcheck="false">
    </label>
    <button id="saveSettings">Save</button>
    <label>Add a model ID
      <span class="row"><input id="modelInput" type="text"><button id="addModel">Add</button></span>
    </label>
    <ul id="modelList"></ul>
    <p class="hint" id="keyHint"></p>
  </section>

  <section id="context">
    <div class="tabline modelline"><select id="providerSelect" title="Provider"></select><select id="modelSelect" title="Model"></select></div>
    <div class="tabline">🗂 <span id="tabInfo">…</span> <button id="refresh" title="Re-check the current tab">↻</button></div>
    <div class="toggles">
      <label><input type="checkbox" id="useSelection">Selection</label>
      <label><input type="checkbox" id="usePage"> Page text</label>
      <label><input type="checkbox" id="useShot"> Screenshot</label>
      <label><input type="checkbox" id="usePdf"> PDF</label>
    </div>
  </section>

  <main id="log"></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about what you're looking at…"></textarea>
      <button id="send" title="Send (Enter)">↑</button>
    </div>
  </footer>

  <script src="providers.js"></script>
  <script src="panel.js"></script>
</body>
</html>
